<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AcroMap — Lexique LabCyber</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f7fa; --card:#ffffff; --text:#0d0d10; --sub:#5c5c66;
  --accent:#5B3EF0; --accent-soft:#ece7fc; --border:#e6e5ec;
  --chip:#efedf7; --chip-active:#5B3EF0; --chip-active-text:#fff;
  --fav:#e0863f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f0f13; --card:#1a1a20; --text:#f2f1f6; --sub:#a3a1ad;
    --accent:#8f7bff; --accent-soft:#25203f; --border:#2b2a33;
    --chip:#232229; --chip-active:#8f7bff; --chip-active-text:#0f0f13;
    --fav:#e6a15c;
  }
}
:root[data-theme="dark"]{
  --bg:#0f0f13; --card:#1a1a20; --text:#f2f1f6; --sub:#a3a1ad;
  --accent:#8f7bff; --accent-soft:#25203f; --border:#2b2a33;
  --chip:#232229; --chip-active:#8f7bff; --chip-active-text:#0f0f13;
  --fav:#e6a15c;
}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
*{box-sizing:border-box;}
body{
  margin:0; height:100%; background:var(--bg); color:var(--text);
  font-family:'Poppins',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex; flex-direction:column;
}
header{
  padding:calc(env(safe-area-inset-top,0px)+16px) 16px 12px;
  background:var(--card); border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:5;
}
h1{margin:0 0 2px; font-size:1.4rem; font-weight:800; letter-spacing:-0.01em; text-transform:lowercase; color:var(--text);}
h1 .hi{color:var(--accent);}
.sub{color:var(--sub); font-size:0.85rem; margin:0 0 12px; font-weight:600;}
.search-wrap{position:relative;}
#search{
  width:100%; padding:11px 40px 11px 14px; border-radius:12px;
  border:1px solid var(--border); background:var(--bg); color:var(--text);
  font-size:1rem; outline:none;
}
#search:focus{border-color:var(--accent);}
.clear-btn{
  position:absolute; right:8px; top:50%; transform:translateY(-50%);
  background:none; border:none; color:var(--sub); font-size:1.1rem; cursor:pointer;
  padding:6px; display:none; line-height:1;
}
.tabs{
  display:flex; gap:6px; overflow-x:auto; margin-top:10px; padding-bottom:2px;
  -ms-overflow-style:none; scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none;}
.chip{
  flex:0 0 auto; padding:6px 12px; border-radius:20px; background:var(--chip);
  color:var(--text); font-size:0.82rem; font-weight:700; border:none; cursor:pointer;
  white-space:nowrap;
}
.chip.active{background:var(--chip-active); color:var(--chip-active-text);}
.game-toggle{
  margin-top:10px; width:100%; padding:10px; border-radius:12px; border:none;
  background:var(--accent); color:#fff; font-weight:700; font-size:0.88rem; cursor:pointer;
}
.game-view{padding:6px 2px 10px;}
.game-card{
  background:var(--card); border:1px solid var(--border); border-radius:14px;
  padding:20px 16px; display:flex; flex-direction:column; gap:14px;
}
.game-score{color:var(--sub); font-size:0.82rem; font-weight:700;}
.game-label{color:var(--sub); font-size:0.85rem;}
.game-def{font-size:1.5rem; font-weight:800; color:var(--accent); line-height:1.3;}
.game-masked{
  font-family:'Courier New',monospace; font-size:1rem; letter-spacing:1px; color:var(--sub);
  line-height:1.5; word-break:break-word;
}
.game-hint{
  align-self:flex-start; padding:7px 12px; border-radius:8px; border:1px solid var(--accent);
  background:var(--accent-soft); color:var(--accent); font-weight:700; font-size:0.8rem; cursor:pointer;
}
.game-hint[disabled]{opacity:0.45; cursor:default;}
.game-input{
  width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--border);
  background:var(--bg); color:var(--text); font-family:inherit; font-size:0.92rem; resize:none;
}
.game-answer{
  padding:12px 14px; border-radius:10px; background:var(--accent-soft); color:var(--text);
  font-size:0.95rem; font-weight:600; line-height:1.4;
}
.game-know, .game-dont{
  flex:1; padding:9px 14px; border-radius:10px; border:none; font-weight:700; font-size:0.88rem; cursor:pointer;
}
.game-know{background:#1e7e42; color:#fff;}
.game-dont{background:#b3423a; color:#fff;}
.game-actions{display:flex; gap:10px; flex-wrap:wrap;}
.game-next{
  padding:9px 16px; border-radius:10px; border:none; background:var(--accent); color:#fff;
  font-weight:700; font-size:0.88rem; cursor:pointer;
}
.game-quit{
  padding:9px 16px; border-radius:10px; border:1px solid var(--border); background:var(--card);
  color:var(--sub); font-weight:600; font-size:0.85rem; cursor:pointer;
}
main{flex:1; overflow-y:auto; padding:10px 16px 24px;}
.count{color:var(--sub); font-size:0.8rem; margin:6px 2px 10px;}
ul#list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
li.entry{
  background:var(--card); border:1px solid var(--border); border-radius:12px;
  padding:12px 14px; display:flex; gap:10px; align-items:flex-start;
}
.entry-main{flex:1; min-width:0;}
.acro{font-weight:800; color:var(--accent); font-size:1rem;}
.def{color:var(--text); font-size:0.92rem; margin-top:2px; line-height:1.35;}
.fr{color:var(--sub); font-size:0.82rem; margin-top:4px; font-style:italic;}
mark{background:var(--accent-soft); color:var(--text); border-radius:3px; padding:0 1px;}
.fav-btn{
  background:none; border:none; cursor:pointer; font-size:1.2rem; color:var(--border);
  padding:2px 4px; flex:0 0 auto;
}
.fav-btn.active{color:var(--fav);}
.empty{color:var(--sub); text-align:center; padding:40px 20px; font-size:0.95rem;}
footer{
  padding:10px 16px calc(env(safe-area-inset-bottom,0px)+10px); text-align:center;
  color:var(--sub); font-size:0.72rem; border-top:1px solid var(--border); background:var(--card);
}
</style>
</head>
<body>
<header>
  <h1>acro<span class="hi">map</span></h1>
  <p class="sub">Lexique bilingue d'acronymes du LabCyber — 605 entrées</p>
  <div class="search-wrap">
    <input id="search" type="text" placeholder="Chercher un acronyme ou une définition…" autocomplete="off">
    <button class="clear-btn" id="clearBtn" aria-label="Effacer">✕</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <button id="gameToggle" class="game-toggle">🎲 Deviner un acronyme</button>
</header>
<main>
  <div class="count" id="count"></div>
  <ul id="list"></ul>
  <div class="empty" id="empty" style="display:none;">Aucun résultat trouvé.</div>
  <div id="gameView" class="game-view" style="display:none;">
    <div class="game-card">
      <div class="game-score" id="gameScore"></div>
      <div class="game-label">Que signifie cet acronyme ? Essayez de le développer :</div>
      <div class="game-def" id="gameDef"></div>
      <div class="game-masked" id="gameMasked"></div>
      <button id="gameHint" class="game-hint">💡 Indice (une lettre)</button>
      <textarea id="gameInput" class="game-input" rows="2" placeholder="Votre réponse (optionnel, pour vous aider à réfléchir)…"></textarea>
      <button id="gameReveal" class="game-next">Voir la réponse</button>
      <div id="gameAnswer" class="game-answer" style="display:none;"></div>
      <div id="gameSelfScore" class="game-actions" style="display:none;">
        <button id="gameKnew" class="game-know">✅ Je savais</button>
        <button id="gameDidnt" class="game-dont">❌ Je ne savais pas</button>
      </div>
      <div class="game-actions">
        <button id="gameNext" class="game-next" style="display:none;">Suivant →</button>
        <button id="gameQuit" class="game-quit">Quitter le jeu</button>
      </div>
    </div>
  </div>
</main>
<footer>Extrait de la carte XMind « Lexique bilingue d'acronymes du LabCyber »</footer>

<script>
let favorites = new Set();
let activeFilter = 'ALL';
let query = '';

const listEl = document.getElementById('list');
const countEl = document.getElementById('count');
const emptyEl = document.getElementById('empty');
const searchEl = document.getElementById('search');
const clearBtn = document.getElementById('clearBtn');
const tabsEl = document.getElementById('tabs');

function letters(){
  const set = new Set(ENTRIES.map(e => e.a.charAt(0).toUpperCase()));
  return Array.from(set).sort();
}

function buildTabs(){
  const ls = letters();
  const frag = [];
  frag.push(chip('ALL', 'Tout'));
  frag.push(chip('FAV', '★ Favoris'));
  ls.forEach(l => frag.push(chip(l, l)));
  tabsEl.innerHTML = frag.join('');
  tabsEl.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', () => {
      activeFilter = btn.dataset.val;
      render();
    });
  });
}
function chip(val, label){
  return `<button class="chip" data-val="${val}">${label}</button>`;
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function highlight(text, q){
  if(!q) return escapeHtml(text);
  const esc = escapeHtml(text);
  const idx = esc.toLowerCase().indexOf(q.toLowerCase());
  if(idx === -1) return esc;
  return esc.slice(0,idx) + '<mark>' + esc.slice(idx, idx+q.length) + '</mark>' + esc.slice(idx+q.length);
}

function matches(entry){
  if(activeFilter === 'FAV'){
    if(!favorites.has(entry.a + '|' + entry.d)) return false;
  } else if(activeFilter !== 'ALL'){
    if(entry.a.charAt(0).toUpperCase() !== activeFilter) return false;
  }
  if(query){
    const q = query.toLowerCase();
    return entry.a.toLowerCase().includes(q);
  }
  return true;
}

function render(){
  tabsEl.querySelectorAll('.chip').forEach(b => {
    b.classList.toggle('active', b.dataset.val === activeFilter);
  });
  const filtered = ENTRIES.filter(matches);
  countEl.textContent = filtered.length + (filtered.length === 1 ? ' résultat' : ' résultats');
  if(filtered.length === 0){
    listEl.innerHTML = '';
    emptyEl.style.display = 'block';
    return;
  }
  emptyEl.style.display = 'none';
  listEl.innerHTML = filtered.map(e => {
    const key = e.a + '|' + e.d;
    const isFav = favorites.has(key);
    return `<li class="entry">
      <div class="entry-main">
        <div class="acro">${highlight(e.a, query)}</div>
        <div class="def">${highlight(e.d, query)}</div>
      </div>
      <button class="fav-btn ${isFav ? 'active' : ''}" data-key="${escapeHtml(key)}" aria-label="Favori">${isFav ? '★' : '☆'}</button>
    </li>`;
  }).join('');
  listEl.querySelectorAll('.fav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.key;
      if(favorites.has(key)) favorites.delete(key); else favorites.add(key);
      saveFavs();
      render();
    });
  });
}

function saveFavs(){
  try{
    localStorage.setItem('acromap_favs', JSON.stringify(Array.from(favorites)));
  }catch(e){}
}
function loadFavs(){
  try{
    const raw = localStorage.getItem('acromap_favs');
    if(raw) favorites = new Set(JSON.parse(raw));
  }catch(e){}
}

searchEl.addEventListener('input', () => {
  query = searchEl.value.trim();
  clearBtn.style.display = query ? 'block' : 'none';
  render();
});
clearBtn.addEventListener('click', () => {
  searchEl.value = '';
  query = '';
  clearBtn.style.display = 'none';
  searchEl.focus();
  render();
});

// --- Jeu "Deviner un acronyme" ---
const gameToggle = document.getElementById('gameToggle');
const gameView = document.getElementById('gameView');
const gameDef = document.getElementById('gameDef');
const gameMasked = document.getElementById('gameMasked');
const gameHint = document.getElementById('gameHint');
const gameInput = document.getElementById('gameInput');
const gameReveal = document.getElementById('gameReveal');
const gameAnswer = document.getElementById('gameAnswer');
const gameSelfScore = document.getElementById('gameSelfScore');
const gameKnew = document.getElementById('gameKnew');
const gameDidnt = document.getElementById('gameDidnt');
const gameScore = document.getElementById('gameScore');
const gameNext = document.getElementById('gameNext');
const gameQuit = document.getElementById('gameQuit');
const mainList = document.getElementById('list');
const mainEmpty = document.getElementById('empty');
const mainCount = document.getElementById('count');

let score = 0, streak = 0, current = null, revealedMask = [];

function isLetter(ch){
  return /[A-Za-zÀ-ÖØ-öø-ÿ]/.test(ch);
}

function renderMasked(){
  const text = current.d;
  gameMasked.textContent = text.split('').map((ch, i) =>
    isLetter(ch) ? (revealedMask[i] ? ch : '_') : ch
  ).join('');
  const hiddenLeft = revealedMask.filter((v, i) => isLetter(text[i]) && !v).length;
  gameHint.disabled = hiddenLeft === 0;
  gameHint.textContent = hiddenLeft === 0 ? '💡 Toutes les lettres sont visibles' : '💡 Indice (une lettre)';
}

function useHint(){
  const text = current.d;
  const hiddenIndices = [];
  for(let i = 0; i < text.length; i++){
    if(isLetter(text[i]) && !revealedMask[i]) hiddenIndices.push(i);
  }
  if(hiddenIndices.length === 0) return;
  const pick = hiddenIndices[Math.floor(Math.random() * hiddenIndices.length)];
  revealedMask[pick] = true;
  renderMasked();
}

function newQuestion(){
  current = ENTRIES[Math.floor(Math.random() * ENTRIES.length)];
  gameDef.textContent = current.a;
  revealedMask = new Array(current.d.length).fill(false);
  renderMasked();
  gameInput.value = '';
  gameAnswer.style.display = 'none';
  gameSelfScore.style.display = 'none';
  gameReveal.style.display = 'inline-block';
  gameNext.style.display = 'none';
  gameScore.textContent = `Score : ${score}   ·   Série : ${streak}`;
  gameInput.focus();
}

gameHint.addEventListener('click', useHint);

gameReveal.addEventListener('click', () => {
  gameAnswer.textContent = current.d;
  gameAnswer.style.display = 'block';
  gameSelfScore.style.display = 'flex';
  gameReveal.style.display = 'none';
});

gameKnew.addEventListener('click', () => {
  score++; streak++;
  gameScore.textContent = `Score : ${score}   ·   Série : ${streak}`;
  gameSelfScore.style.display = 'none';
  gameNext.style.display = 'inline-block';
});
gameDidnt.addEventListener('click', () => {
  streak = 0;
  gameScore.textContent = `Score : ${score}   ·   Série : ${streak}`;
  gameSelfScore.style.display = 'none';
  gameNext.style.display = 'inline-block';
});

gameToggle.addEventListener('click', () => {
  gameView.style.display = 'block';
  mainList.style.display = 'none';
  mainEmpty.style.display = 'none';
  mainCount.style.display = 'none';
  newQuestion();
});
gameQuit.addEventListener('click', () => {
  gameView.style.display = 'none';
  mainList.style.display = '';
  mainCount.style.display = '';
  render();
});
gameNext.addEventListener('click', newQuestion);

loadFavs();
buildTabs();
render();
</script>
